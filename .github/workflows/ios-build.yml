name: Build iOS App
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode 16
      # Исправленный путь: Xcode_16.app (без .0)
      run: sudo xcode-select -s /Applications/Xcode_16.app

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Install MAUI Workload
      run: |
        dotnet workload install maui-ios
        dotnet workload restore

    - name: Publish iOS App
      # Добавили флаг игнорирования проверки SDK на всякий случай
      run: dotnet publish -f net8.0-ios -c Release -p:ArchiveOnBuild=true -p:RuntimeIdentifier=ios-arm64 -p:EnableCodeSigning=false -p:CodesignKey="" -p:CodesignProvision="" -p:_SuppressSdkVersionCheck=true
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: HexStressApp
        path: bin/Release/net8.0-ios/ios-arm64/publish/*.ipa